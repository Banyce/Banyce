.wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 2rem; letter-spacing: -0.03em; margin: 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.switch { display: inline-flex; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px; gap: 4px; }
.switch button {
  font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--ink);
  padding: 10px 18px; border-radius: 999px; cursor: pointer; min-height: 44px;
}

    var root = document.documentElement;
    root.setAttribute("lang", L);
    root.setAttribute("dir", L === "ar" ? "rtl" : "ltr");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    $("langCur").textContent = L.toUpperCase();
    document.querySelectorAll("#langMenu button").forEach(function (b) { b.setAttribute("aria-current", String(b.dataset.lang === L)); });
    $("wa-note").innerHTML = "";
    var parts = t("wa_note").split("{num}");
    $("wa-note").appendChild(document.createTextNode(parts[0]));
    var sp = document.createElement("span"); sp.className = "wa-num"; sp.setAttribute("dir", "ltr"); sp.textContent = NUM_DISP;
    $("wa-note").appendChild(sp);
    $("wa-note").appendChild(document.createTextNode(parts[1] || ""));
    buildSelects();
    applyMode();
    try { localStorage.setItem("banyce-lang", L); } catch (e) {}
  }
  function applyMode() {
    var mode = S.mode;
    $("tab-part").setAttribute("aria-selected", String(mode === "part"));
    $("tab-pro").setAttribute("aria-selected", String(mode === "pro"));
    $("h-title").textContent = t("h_" + mode);
    $("h-sub").textContent = t("s_" + mode);
    $("pc-note").textContent = t("pn_" + mode);
    $("f-unit").textContent = nf(MODE[mode].size);
    $("f-unit-t").textContent = t("fu_" + mode);
    $("q-legend").textContent = t("q_" + mode);
    $("row-company").hidden = mode !== "pro";
    $("row-siret").hidden = mode !== "pro";
    buildChips();
    render();
  }
  function setMode(next, fromHash) {
    S.mode = next; S.qty = 1; ensureMin();
    if (!fromHash) { try { history.replaceState(null, "", next === "pro" ? "#professionnels" : "#particuliers"); } catch (e) {} }
    applyMode();
  }

  /* ---------- Validation ---------- */
  function problems() {
    var out = [], v = function (id) { return $(id).value.trim(); };
    var add = function (id, label) { out.push({ id: id, label: label }); };
    var c = calc();
    if (S.mode === "pro") {
      if (!v("company")) add("company", t("company"));
      var s = v("siret");
      if (!s || (/^[\d\s]+$/.test(s) && s.replace(/\s/g, "").length !== 14)) add("siret", t("e_siret"));
    }
    if (!v("nom")) add("nom", t("last"));
    if (!v("prenom")) add("prenom", t("first"));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v("email"))) add("email", t("e_email"));
    if (!/^\d{6,14}$/.test(v("phone").replace(/[\s().\-]/g, ""))) add("phone", t("e_phone"));
    if (c.on) {
      if (!v("adresse")) add("adresse", t("address"));
      if (!v("cp")) add("cp", t("zip"));
      else if (c.needcp) add("cp", t("e_cp"));
      if (!v("ville")) add("ville", t("city"));
    }
    if (!v("date")) add("date", t("date"));
    return out;
  }

  /* ---------- Événements ---------- */
  $("tab-part").addEventListener("click", function () { setMode("part"); });
  $("tab-pro").addEventListener("click", function () { setMode("pro"); });
  $("minus").addEventListener("click", function () { if (S.qty > 1) { S.qty--; render(); } });
  $("plus").addEventListener("click", function () { if (S.qty < MODE[S.mode].max) { S.qty++; render(); } });
  document.querySelectorAll('input[name="deliv"]').forEach(function (r) { r.addEventListener("change", function () { ensureMin(); render(); }); });
  $("dcountry").addEventListener("change", function () { S.dc = this.value; ensureMin(); render(); });
  $("pcode").addEventListener("change", function () { S.pc = this.value; render(); });
  ["company", "siret", "nom", "prenom", "email", "phone", "adresse", "cp", "ville", "date"].forEach(function (id) { $(id).addEventListener("input", render); });

  $("wa").addEventListener("click", function (e) {
    var c = calc(), pr = problems();
    if (pr.length || c.belowMin) {
      e.preventDefault();
      var msg = [];
      if (pr.length) msg.push(t("e_miss") + pr.map(function (p) { return p.label; }).join(", ") + ".");
      if (c.belowMin) msg.push(t("min_note"));
      $("err").textContent = msg.join(" ");
      if (pr.length) $(pr[0].id).focus();
    } else {
      $("err").textContent = "";
      render();
    }
  });
  $("copy").addEventListener("click", function () {
    var txt = message(), btn = $("copy");
    function done() { btn.textContent = t("copied"); setTimeout(function () { btn.textContent = t("copy_btn"); }, 2000); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });

  /* Menu de langue */
  var menu = $("langMenu"), lbtn = $("langBtn");
  function closeMenu() { menu.hidden = true; lbtn.setAttribute("aria-expanded", "false"); }
  lbtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = menu.hidden;
    menu.hidden = !open; lbtn.setAttribute("aria-expanded", String(open));
  });
  menu.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b) return;
    S.lang = b.dataset.lang; closeMenu(); applyLang();
  });
  document.addEventListener("click", closeMenu);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeMenu(); lbtn.focus(); } });

  /* Date minimale : demain */
  var d = new Date(); d.setDate(d.getDate() + 1);
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  $("date").min = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

  function fromHash() { S.mode = location.hash === "#professionnels" ? "pro" : "part"; S.qty = 1; applyMode(); }
  window.addEventListener("hashchange", fromHash);

  try { var saved = localStorage.getItem("banyce-lang"); if (saved && I18N[saved]) S.lang = saved; } catch (e) {}
  S.mode = location.hash === "#professionnels" ? "pro" : "part";
  applyLang();
})();
</script>

</body>
</html>
